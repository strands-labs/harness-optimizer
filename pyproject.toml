[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "strands-harness-optimizer"
dynamic = ["version"]
description = "A framework for optimizing LLM agent context through Formulas"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = []
maintainers = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["llm", "context-optimization", "ai-agents", "prompt-optimization"]
requires-python = ">=3.10"
dependencies = [
    "strands-agents>=1.0.0",
    "strands-agents-tools>=0.1.0",
    "jinja2>=3.0.0",
    "botocore>=1.30.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "python-dotenv>=1.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.990",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "strands_harness_optimizer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["strands_harness_optimizer"]

[tool.hatch.build.targets.sdist]
include = [
    "strands_harness_optimizer",
    "tests",
    "README.md",
    "LICENSE",
    "NOTICE",
]

[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args}"
lint = [
    "black --check strands_harness_optimizer tests",
    "isort --check-only strands_harness_optimizer tests",
]
format = [
    "black strands_harness_optimizer tests",
    "isort strands_harness_optimizer tests",
]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
minversion = "7.0"
addopts = ["-ra", "-q", "--strict-markers"]
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests requiring AWS credentials and a real LLM model",
]
